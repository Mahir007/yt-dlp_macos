name: CI

on:
  # Branches only: a release tag runs this through release.yml instead.
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - LICENSE
  workflow_call:
  workflow_dispatch:

# A newer push to the same branch cancels the run for the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: zsh 5.8 on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # macOS 12 ships zsh 5.8, the oldest version the script supports, and
      # GitHub has no macOS 12 runners. Debian 11 packaged the same release.
      - name: Install zsh 5.8
        working-directory: ${{ runner.temp }}
        run: |
          base=https://archive.debian.org/debian/pool/main/z/zsh
          curl -fsSLO "$base/zsh-common_5.8-6+deb11u1_all.deb"
          curl -fsSLO "$base/zsh_5.8-6+deb11u1_amd64.deb"
          sha256sum -c - <<'EOF'
          2466fcf973de97c6ba9d4459a06a1e0faab93a44e16fe72520bba76fc377f533  zsh-common_5.8-6+deb11u1_all.deb
          0d42edeaeb806767bcfde72eb3c29aa34f5065db061e918a2b64ebb0a9821a80  zsh_5.8-6+deb11u1_amd64.deb
          EOF
          sudo dpkg -i zsh-common_5.8-6+deb11u1_all.deb zsh_5.8-6+deb11u1_amd64.deb
          /bin/zsh --version

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  standalone:
    name: zsh 5.7.1 on Linux, standalone script
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # macOS 10.15 ships zsh 5.7.1, the oldest version the standalone
      # script supports. Debian 10 packaged the same release.
      - name: Install zsh 5.7.1
        working-directory: ${{ runner.temp }}
        run: |
          base=https://archive.debian.org/debian/pool/main/z/zsh
          curl -fsSLO "$base/zsh-common_5.7.1-1+deb10u1_all.deb"
          curl -fsSLO "$base/zsh_5.7.1-1+deb10u1_amd64.deb"
          sha256sum -c - <<'EOF'
          3f0a99094085e16e2f0d9c93f20f7cc93efb673518f51dcea37c392cff79ef02  zsh-common_5.7.1-1+deb10u1_all.deb
          89cd7d28a5e86087c5a57f21af117e868c488d27e82dc1e905aa124aab242d61  zsh_5.7.1-1+deb10u1_amd64.deb
          EOF
          sudo dpkg -i zsh-common_5.7.1-1+deb10u1_all.deb zsh_5.7.1-1+deb10u1_amd64.deb
          /bin/zsh --version

      - name: Test
        run: make test-standalone

  macos:
    name: zsh on macOS 15
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Show zsh version
        run: /bin/zsh --version

      # The tests that run YouTube Downloader Pro need bash 4 or later. The
      # runner has only /bin/bash 3.2. This takes about 3 seconds.
      - name: Install bash
        run: brew install bash

      - name: Test
        run: make test
